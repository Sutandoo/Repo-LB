<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10172a">
    <title>Práctica de balanceo de carga</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #10172a;
        color: #f5f7ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 18% 18%, rgb(99 102 241 / 22%), transparent 38%),
          radial-gradient(ellipse at 82% 78%, rgb(20 184 166 / 16%), transparent 35%),
          #10172a;
      }

      main {
        width: min(90vw, 680px);
        padding: clamp(2rem, 8vw, 5rem) 2rem;
        text-align: center;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 28px;
        background: rgb(255 255 255 / 5%);
        box-shadow: 0 30px 90px rgb(0 0 0 / 30%);
        backdrop-filter: blur(12px);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0.5rem 0.85rem;
        border: 1px solid rgb(52 211 153 / 25%);
        border-radius: 999px;
        background: rgb(52 211 153 / 9%);
        color: #a7f3d0;
        font-size: 0.78rem;
        font-weight: 650;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .status::before {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: #34d399;
        box-shadow: 0 0 12px #34d399;
        content: "";
      }

      h1 {
        margin: 1.8rem 0 0.75rem;
        font-size: clamp(2.2rem, 8vw, 4.5rem);
        line-height: 1.05;
        letter-spacing: -0.06em;
      }

      .server-number {
        color: #a5b4fc;
        background: linear-gradient(110deg, #a5b4fc, #67e8f9);
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      p {
        margin: 0;
        color: #a7b0c5;
        font-size: clamp(1rem, 2.5vw, 1.15rem);
        line-height: 1.7;
      }

      footer {
        margin-top: 2.5rem;
        color: #69758e;
        font-size: 0.8rem;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="status">En línea</span>
      <h1>Este es el servidor <span class="server-number">#1</span></h1>
      <p>Tu solicitud llegó a una instancia lista para responder.</p>
      <footer>Práctica de balanceo de carga</footer>
    </main>
  </body>
</html>
